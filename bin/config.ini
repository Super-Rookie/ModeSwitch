# ModeSwitch settings. Edit, then switch modes again to apply.
# NVIDIA setting IDs were read from your driver (616.64) with NvProbe.exe.

# --- Re-apply the stored mode after logon -----------------------------------
# Afterburner's curve and Windows HDR do not survive a reboot, so the app reapplies the mode
# it was last in. Delay gives the desktop and the display time to settle first.
apply.onstart         = true
apply.onstart.delayms = 15000

# --- Hardware-accelerated GPU scheduling (needs a reboot) ---
hags.movie = 1
hags.game  = 2

# --- NVIDIA Control Panel: Vertical Sync (same in both modes: On) ---
vsync.both = 0x00A879CF:0x47814940

# --- NVIDIA Control Panel: G-SYNC ---
# Both sets were read from your driver: movie = G-Sync disabled, game = full screen + windowed.
gsync.movie = 0x1194F158:0, 0x1094F157:0, 0x1094F1F7:0, 0x10A879CF:4
gsync.game  = 0x1194F158:2, 0x1094F157:1, 0x1094F1F7:2, 0x10A879CF:0

# --- Windows HDR ---
hdr.movie = off
hdr.game  = on

# --- GPU clocks -------------------------------------------------------------
# The core undervolt is a 127-point voltage/frequency curve. Only Afterburner can apply that,
# so ModeSwitch copies one of Afterburner's saved profile sections into its [Startup] section
# and relaunches it. Memory offset and power limit are overridden below.
#   Profile1 = your undervolt curve      Profile2 = flat/stock curve
ab.exe = C:\Program Files (x86)\MSI Afterburner\MSIAfterburner.exe
# /s makes Afterburner apply its [Startup] section. That only works while Afterburner's
# "Start with Windows" option is enabled; with it off, /s makes Afterburner quit immediately.
# Leave this blank to launch it plainly (it then keeps its last applied settings).
ab.args = /s
# How long to give Afterburner to load and apply a profile before the switch counts as done.
ab.applydelayms = 6000
ab.cfg = C:\Program Files (x86)\MSI Afterburner\Profiles\VEN_10DE&DEV_2C02&SUBSYS_89D71043&REV_A1&BUS_1&DEV_0&FN_0.cfg

# Movie: stock curve, stock memory and power, and Afterburner closed again afterwards
ab.movie.profile   = Profile2
ab.movie.memclk    = 0
ab.movie.power     = 0
ab.movie.stopafter = true

# Game: your undervolt curve, Afterburner left running for the RTSS overlay.
# memclk 0 = no memory overclock. Your old setting was 1500000 (+1500 MHz); that was active
# while the GPU was logging hangs, so it starts disabled here. power 111 = the 400 W limit.
ab.game.profile   = Profile1
ab.game.memclk    = 0
# power 0 = keep the profile's own limit (Profile1 is 100%). Set 111 for the old 400 W limit.
ab.game.power     = 0
ab.game.stopafter = false

# Clear leftover flat pstate offsets (not the curve) when entering a mode
oc.movie.clearoffsets = true
oc.game.clearoffsets  = false

# --- sound (applied to the current default playback device) ---
# Presets: atmos-hometheater, atmos-headphones, stereo-24-96, 7.1-24-96
# Leave blank to leave audio alone when switching modes. The tray menu can set any preset anytime.
sound.movie = 7.1-24-96
sound.game  = atmos-hometheater

# --- display resolution per mode (optional) ---
# Applied to the display whose name contains display.target (blank = primary display), and
# skipped when that display isn't connected, e.g. while the TV is in use.
display.target = SONY PJ
display.movie  = 3840x2160@23
display.3d     = 1920x1080@23

# --- projector network control (Sony PJ Talk / SDCP, TCP 53484) ---
# Item numbers read from this VPL-VW760ES:
#   0x0060 = 2D-3D display select (0 Auto, 1 3D)   0x0061 = 3D format (1 Side-by-Side, 2 Over-Under)
# Skipped quietly when the projector is off or unreachable (e.g. while the TV is in use).
projector.ip        =
projector.community = SONY
# 3D Movie mode keeps the projector in 2D so the desktop stays usable; "Play 3D..." switches it to
# 3D (format picked from the file name) when the film starts and back to 2D when it ends.
# Set projector.3d = 0x0060:1, 0x0061:2 to have the mode itself switch the projector to 3D.
projector.movie     = 0x0060:0
projector.3d        = 0x0060:0
projector.game      = 0x0060:0

# --- 3D Movie mode ---
# Inherits every Movie setting (GPU scheduling, G-Sync, HDR, Afterburner, sound) unless a
# ".3d" key is set here. The projector only takes frame-compatible 3D at 1080p, and its 3D
# format has to be chosen with the remote to match the film.
reminder.3d = 3D: set the projector's 3D format to match the film (side-by-side or top-and-bottom)
# Shown instead when the projector is controlled over the network (it stays 2D until a film plays).
reminder.3d.networked = 3D ready: use "Play 3D..." to switch the projector to 3D for the film, or Projector > 3D

# "Play 3D Blu-ray / 3D film..." (tray menu) and ModeSwitch.exe --play3d <file>:
# switches to 3D Movie, mounts an ISO, plays it fullscreen, then ejects and switches back.
# Blank player = whatever .mkv files open with (the K-Lite MPC-HC here).
play3d.player =
play3d.args   = /fullscreen /play

# --- log ---
# When ModeSwitch.log passes this size it becomes ModeSwitch.old.log and a new log starts.
log.maxkb = 256

# --- right-click menu shortcuts ---
# NVIDIA Control Panel (Store app ID) and the Windows display settings page
open.nvcp    = shell:AppsFolder\NVIDIACorp.NVIDIAControlPanel_56jybvy8sckqj!NVIDIACorp.NVIDIAControlPanel
open.display = ms-settings:display

# --- other apps (Afterburner itself is handled above) ---
apps.movie.stop  = RTSS, RTSSHooksLoader64
apps.game.start  =
